<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Normalize.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/animation+JS.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <div class="center">
        <div class="text">
            <h1>Simple, traffic-based pricing</h1>
            <p>Sign-up for our 30-day trial. No credit card required. </p>
        </div>

        <div class="container">
            <div class="up">
                <div class="text1">
                    <p>
                        <span class="k">100K Pageviews</span>
                        <span class="month">
                            <span class="s1">$16.00</span>
                            <span> /month</span>
                        </span>
                    </p>
                </div>

                <div class="inputs">
                    <input type="range" min="0" max="50" value="16">
                    <span class="tri">&#9664; &#9654;</span>

                    <div class="text2">
                        <p>Monthly Billing</p>

                        <div class="shape">
                            <span></span>
                        </div>

                        <p>Yearly Billing<span class="s2">25% discount</span></p>
                    </div>
                </div>
            </div>
            
            <span class="end-line"></span>

            <div class="down">
                    <div class="left">
                        <p><i class="fa-solid fa-check"></i>Unlimited websites</p>
                        <p><i class="fa-solid fa-check"></i>100% data ownership</p>
                        <p><i class="fa-solid fa-check"></i>Email reports</p>
                    </div>

                    <div class="right">
                        <button>Start my trial</button>
                    </div>
            </div>
        </div>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
