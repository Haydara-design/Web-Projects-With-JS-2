<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Normalize.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/animation+JS.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>


<body>
    <div class="center">
        <div class="logo">
            <img src="images/logo.svg" alt="">
        </div>
        <div class="container">
            <div class="left">
                <div class="bill">
                    <div class="test">
                        <label for="B">Bill</label>
                    </div>
                    
                    <div class="mark">
                        <span><img src="images/icon-dollar.svg" alt=""></span>
                        <input type="text" placeholder="0" id="B">
                    </div>
                </div>
                <p>
                    Select Tip %
                <p>
                <div class="grid">
                    <p>5%</p>
                    <p>10%</p>
                    <p>15%</p>
                    <p>25%</p>
                    <p>50%</p>
                    <div class="cont">
                        <div class="shape">
                            <div class="front">
                                <p>Custom</p>
                            </div>
                            <div class="back"><input type="text"></div>
                        </div>
                    </div>

                </div>

                <div class="bill">
                    <div class="test">
                        <label for="num">Number of People</label>
                    </div>
                    
                    <div class="mark">
                        <span><img src="images/icon-person.svg" alt=""></span>
                        <input type="text" placeholder="0" id="num">
                    </div>
                </div>
            </div>


            <div class="right">
                <div class="text">
                    <p>Tip Amount <br><span class="s1">/ person</span></p>
                    <p class="p1">$<span>0.00</span> </p>
                </div>
                <div class="text">
                    <p>Tip Amount <br><span class="s1">/ person</span></p>
                    <p class="p1">$<span>0.00</span> </p>
                </div>
                <div class="buttons">
                    <button>Confirm</button>
                    <button>Reset</button>
                </div>

            </div>
        </div>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
