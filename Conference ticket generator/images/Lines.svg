<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 800" preserveAspectRatio="none" style="position: absolute; top: 0; left: 0; z-index: -1;">
  <!-- الخط الأكبر (برتقالي فاتح) -->
  <circle cx="300" cy="900" r="400" stroke="url(#orangeGradient)" stroke-width="8" fill="none" stroke-dasharray="1256" <!--="" محيط="" الدائرة="2πr" ≈="" 2*3.14*400="2512" →="" نقسمه="" لنصف="1256" --="">
          stroke-dashoffset="628"     <!-- نبدأ من النصف الثاني (لتظهر القوس السفلي) -->
          transform="rotate(-45 300 900)" /&gt;

  <!-- الخط الأصغر (برتقالي داكن قليلاً) -->
  <circle cx="250" cy="850" r="350" stroke="url(#orangeGradient2)" stroke-width="6" fill="none" stroke-dasharray="1100" <!--="" 2π*350="" ≈="" 2199="" →="" نقسمه="" لنصف="1099.5" --="">
          stroke-dashoffset="550"     <!-- نبدأ من النصف الثاني -->
          transform="rotate(-30 250 850)" /&gt;

  <!-- تعريف التدرجات -->
  <defs>
    <linearGradient id="orangeGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A5C"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>

    <linearGradient id="orangeGradient2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF5C5C"/>
    </linearGradient>
  </defs>
</circle></circle></svg>