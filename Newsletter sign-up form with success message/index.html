<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Normalize.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>


<body>
    <div class="center">
        <div class="container">
            <div class="left">
                <div class="text">
                    <h1>Stay updated!</h1>
                    <p>Join 60,000+ product managers receiving monthly updates on:</p>
                </div>

                <div class="lista">
                    <div>
                        <img src="images/icon-list.svg" alt="">
                        <p>Product discovery and building what matters.</p>
                    </div>
                    <div>
                        <img src="images/icon-list.svg" alt="">
                        <p>Measuring to ensure updates are a success.</p>
                    </div>
                    <div>
                        <img src="images/icon-list.svg" alt="">
                        <p>And much more!.</p>
                    </div>
                </div>

                <form action="">
                    <label for="email"><span>Email address</span></label>
                    <input type="text" id="email" placeholder="email@company.com">
                    <button>Subscribe to monthly newsletter.</button>
                </form>
            </div>

            <div class="right">
                <img src="images/illustration-sign-up-desktop.svg" alt="">
                <img src="images/illustration-sign-up-tablet.svg" alt="">
                <img src="images/illustration-sign-up-mobile.svg" alt="">
            </div>

        </div>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
