<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Normalize.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>


<body>
    <div class="center">
        <div class="container">
            <header>
                <div class="text">
                    <p>My balance</p>
                    <h3>$921.48</h3>
                </div>
                <div class="logo"><img src="images/logo.svg" alt=""></div>
            </header>

            <div class="down">
                <h2>Spending – Last 7 days</h2>
                <div class="flex">

                    <div class="col">
                        <div class="mon shared-before"></div>
                        <p>mon</p>
                    </div>

                    <div class="col">
                        <div class="tue shared-before"></div>
                        <p>tue</p>
                    </div>

                    <div class="col">
                        <div class="wed shared-before"></div>
                        <p>wed</p>
                    </div>

                    <div class="col">
                        <div class="thu shared-before"></div>
                        <p>thu</p>
                    </div>

                    <div class="col">
                        <div class="fri shared-before"></div>
                        <p>fri</p>
                    </div>

                    <div class="col">
                        <div class="sat shared-before"></div>
                        <p>sat</p>
                    </div>

                    <div class="col">
                        <div class="sun shared-before"></div>
                        <p>sun</p>
                    </div>

                </div>
                <footer>
                    <div class="text-left">
                        <p class="s1">Total this month</p>
                        <h1>$ <span>0</span></h1>
                    </div>
                    <div class="text-right">
                        <p>+2.4%</p>
                        <p class="s1">from last month</p>
                    </div>
                </footer>
            </div>
        </div>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
