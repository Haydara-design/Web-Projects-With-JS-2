<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Normalize.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>


<body>
    <div class="center">
        <div class="container">
            <div class="left">
                <div class="up">
                    <div class="image"><img src="images/image-jeremy.png" alt=""></div>
                    <div class="text">
                        <p>Report for</p>
                        <h1>Jeremy Robson</h1>
                    </div>
                </div>

                <div class="down">
                    <p>Daily</p>
                    <p>Weekly</p>
                    <p>Monthly</p>
                </div>

            </div>

            <div class="grid">

                <div class="col w">
                    <div class="image2"><img src="images/icon-work.svg" alt=""></div>
                    <div class="text2">
                        <p>Work</p>
                        <div class="cont">
                            <h1>32hrs</h1>
                            <p>Last Week - 36hrs</p>
                        </div>

                    </div>
                </div>

                <div class="col p">
                    <div class="image2"><img src="images/icon-play.svg" alt=""></div>
                    <div class="text2">
                        <p>Play</p>
                        <div class="cont">
                            <h1>10hrs</h1>
                            <p>Last Week - 8hrs</p>
                        </div>

                    </div>
                </div>

                <div class="col st">
                    <div class="image2"><img src="images/icon-study.svg" alt=""></div>
                    <div class="text2">
                        <p>Study</p>
                        <div class="cont">
                            <h1>4hrs</h1>
                            <p>Last Week - 7hrs</p>
                        </div>

                    </div>
                </div>

                <div class="col e">
                    <div class="image2"><img src="images/icon-exercise.svg" alt=""></div>
                    <div class="text2">
                        <p>Exercise</p>
                        <div class="cont">
                            <h1>4hrs</h1>
                            <p>Last Week - 5hrs</p>
                        </div>

                    </div>
                </div>

                <div class="col so">
                    <div class="image2"><img src="images/icon-social.svg" alt=""></div>
                    <div class="text2">
                        <p>Social</p>
                        <div class="cont">
                            <h1>5hrs</h1>
                            <p>Last Week - 10hrs</p>
                        </div>

                    </div>
                </div>

                <div class="col se">
                    <div class="image2"><img src="images/icon-self-care.svg" alt=""></div>
                    <div class="text2">
                        <p>Self Care</p>
                        <div class="cont">
                            <h1>2hrs</h1>
                            <p>Last Week - 2hrs</p>
                        </div>

                    </div>
                </div>

            </div>

        </div>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
