<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Normalize.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>

<body>

    <div class="container">
        <header>
            <img src="images/logo-full.svg" alt="">
        </header>
        <div class="text">
            <h1>Your Journey to Coding Conf 2025 Starts Here!</h1>
            <p>Secure your spot at next year’s biggest coding conference.</p>
        </div>

        <form action="/upload" method="post" enctype="multipart/form-data">
            <label for="upload">Upload Avatar</label>
            <label for="upload" class="special">
                <div class="image"><img src="images/icon-upload.svg" alt=""></div>
                <p>Drag and drop or click to upload</p>
            </label>
            <input type="file" id="upload" accept="image/*">
            <p class="size">&#9432; Upload your photo (JPG or PNG, max size: 500KB).</p>
            <label for="fn">Full Name</label>
            <input type="text" id="fn">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="example@email.com">
            <label for="github">GitHub Username</label>
            <input type="text" id="github" placeholder="@username">
            <button type="submit">Generate My Ticket</button>
        </form>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
