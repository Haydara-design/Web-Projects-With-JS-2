<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Normalize.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/animation+JS.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <div class="center">
        <header>
            <h1>Our Pricing</h1>
            <div class="price">
                <p>Annually</p>
                <div class="shape">
                    <input type="checkbox" name="" id="">
                    <span></span>
                </div>
                <p>Monthly</p>
            </div>
        </header>

        <div class="container">
            <div class="share left">
                <p class="p1">Basic</p>
                <h1><span class="s1">&dollar;</span><span>19.99</span></h1>
                <p>500 GB Storage</p>
                <p>2 Users Allowed</p>
                <p>Send up to 3 GB</p>
                <button>Learn More</button>
            </div>

            <div class="share special">
                <p class="p1">Professional</p>
                <h1><span class="s1">&dollar;</span><span>24.99</span></h1>
                <p>1 TB Storage</p>
                <p>5 Users Allowed</p>
                <p>Send up to 10 GB</p>
                <button>Learn More</button>
            </div>

            <div class="share right">
                <p class="p1">Master</p>
                <h1><span class="s1">&dollar;</span><span>39.99</span></h1>
                <p>2 TB Storage</p>
                <p>10 Users Allowed</p>
                <p>Send up to 20 GB</p>
                <button>Learn More</button>
            </div>
        </div>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
