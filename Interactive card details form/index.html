<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Normalize.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <title>Document</title>
</head>


<body>
    <div class="container">
        <div class="left">
            <div class="card">
                <div class="circles"><span class="s1"></span> <span class="s2"></span></div>
                <div class="text">
                    <p>1234 5678 9123 0000</p>
                    <p><span>Felicia Leire</span> <span>00/00</span></p>
                </div>
            </div>
            <div class="image"><img src="images/bg-card-back.png" alt=""><p class="num-cvv">000</p></div>
        </div>

        <div class="right">
            <form action="">
                <label for="FN">CARDHOLDER NAME</label>
                <input type="text" placeholder="e.g. Felicia Leire" id="FN">
                <label for="">CARD NUMBER</label>
                <input type="text" placeholder="1234 5678 9123 0000" maxlength="19">

                <div class="info">
                    <div class="month-year">
                        <label for="">EXP. DATE (MM/YY)</label>
                        <input type="number" placeholder="MM" pattern="0-9">
                        <input type="number" placeholder="YY" pattern="0-9">
                    </div>
                    <div class="cvc">
                        <label for="cvc">CVC</label>
                        <input type="number" id="cvc" placeholder="e.g. 123">
                    </div>
                </div>
                <button type="submit">Confirm</button>
            </form>
        </div>
    </div>
    <script src="JS/script.js"></script>
</body>

</html>
